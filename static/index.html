<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e2036"><title>De Ambitiebol · Teamambitie 2026–2027</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#17314b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}a{color:#255e9a}header{background:#102840;color:#fff;padding:20px clamp(18px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}header h1{font-size:23px;margin:0;letter-spacing:-.7px}header small{color:#a5c5db;display:block;margin-top:3px}.chip{padding:7px 12px;border-radius:20px;background:#203f5c;color:#d5e8f9;font-size:12px}.container{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:#fff;border:1px solid #dce6ee;box-shadow:0 10px 35px #152b4a0a;border-radius:22px;padding:24px;margin-bottom:19px}.intro{font-size:clamp(22px,3vw,32px);letter-spacing:-1px;line-height:1.22;margin:0 0 12px}.muted{color:#61758a}.tiny{font-size:12px}.btn{border:0;border-radius:13px;background:#1b6992;color:#fff;padding:13px 17px;font-weight:700;transition:background .2s,transform .2s}.btn:hover{background:#124e73}.btn.secondary{background:#e9f0f6;color:#234960}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.warn{background:#b24b50}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.progress{background:#e8eef4;border-radius:20px;height:10px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#4ca8a9;transition:width .25s}.question{padding:20px 0;border-top:1px solid #edf0f4}.question strong{line-height:1.5}.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.rating button{min-height:65px;border:1px solid #d5e0eb;border-radius:12px;background:#f8fafc;color:#29465b;font-weight:600;padding:8px;font-size:13px}.rating button.selected{color:#fff;background:#1e7891;border-color:#1e7891}.rating button span{display:block;font-size:11px;opacity:.85;font-weight:400;margin-top:3px}.bubble-board{height:450px;position:relative;overflow:hidden;border-radius:19px;background:radial-gradient(circle at 50% 45%,#1d4963,#10263f 68%);color:white}.bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;box-shadow:inset -14px -20px 40px #0002,0 12px 35px #0003;border:2px solid #ffffff25;transition:width 1.15s cubic-bezier(.2,.8,.2,1),height 1.15s cubic-bezier(.2,.8,.2,1),left .75s,top .75s,transform .4s;cursor:pointer;padding:15px;transform:translate(-50%,-50%)}.bubble:hover{filter:brightness(1.12)}.bubble strong{font-size:clamp(12px,1.6vw,19px);max-width:90%}.bubble span{font-size:12px;margin-top:8px;color:#fffdd9}.bubble.hollow{opacity:.65}.dashboard{display:grid;grid-template-columns:minmax(0,2fr) minmax(285px,1fr);gap:18px}.theme-row{padding:14px 0;border-bottom:1px solid #e9eef3}.theme-row:last-child{border-bottom:0}.score{font-size:26px;font-weight:800}.bar{height:8px;background:#e9edf3;border-radius:10px;overflow:hidden;margin:8px 0}.bar>div{height:100%;border-radius:10px;transition:width .6s}.label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field{width:100%;padding:12px;border:1px solid #cbd8e5;border-radius:12px;background:white;color:#18334b;margin-bottom:14px}.field:focus{outline:2px solid #5eacc7}textarea.field{min-height:88px;resize:vertical}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14324c;color:white;padding:14px 20px;border-radius:12px;box-shadow:0 12px 30px #0002;display:none;max-width:90%;z-index:3}.qr{max-width:210px;width:100%;background:white;padding:9px;border-radius:14px;border:1px solid #dde8ef}.pill{background:#edf5f9;border-radius:20px;padding:6px 11px;display:inline-block;color:#225777;font-size:12px;font-weight:700}.detail{border-left:4px solid #58a5a7;padding:10px 12px;margin:10px 0;background:#f6f9fc;border-radius:7px}.top{border:2px solid #57a5a3}.empty{border:1px dashed #c6d4de;border-radius:14px;padding:22px;color:#698195;text-align:center}.code{background:#e9f2f8;padding:7px 12px;border-radius:10px;display:inline-block;font-weight:800;letter-spacing:2px}.row{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hidden{display:none!important}footer{padding:18px;text-align:center;font-size:12px;color:#6e8194}@media(max-width:760px){.dashboard{grid-template-columns:1fr}.bubble-board{height:390px}.bubble{zoom:.72}.rating{grid-template-columns:repeat(2,1fr)}.card{padding:19px}.container{margin:18px auto}.bubble strong{font-size:12px}.bubble span{font-size:10px}header h1{font-size:21px}}@media(prefers-reduced-motion:reduce){.bubble,.progress>div,.bar>div{transition:none}}
</style></head><body><header><div><h1>◉ De Ambitiebol</h1><small>Van gedeelde ambitie naar zichtbaar handelen · 2026–2027</small></div><span id="statusChip" class="chip">Verbinden...</span></header><main id="app" class="container"></main><div id="toast" role="status"></div><footer>Een kleine bol betekent niet dat een onderwerp onbelangrijk is. We onderzoeken waar de komende acht weken extra aandacht gewenst is.</footer><script>
const $=(q)=>document.querySelector(q), esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storage='ambitiebol-user', params=new URLSearchParams(location.search), host=location.pathname==='/host',hostKey=params.get('key')||sessionStorage.getItem('hostKey')||'';
if(hostKey&&host)sessionStorage.setItem('hostKey',hostKey);
const uid=(()=>{let v=localStorage.getItem(storage);if(!v){v=crypto.randomUUID();localStorage.setItem(storage,v)}return v})();
let state=null, answers={},themeIndex=0,lastRev=-1,details='';
const bubbleSizes={};
let persistedCode='';
function restore(code){if(persistedCode===code)return;persistedCode=code;try{answers=JSON.parse(localStorage.getItem('ambitie-answers-'+code+'-'+uid)||'{}')}catch(e){answers={}}}
function remember(){if(state)localStorage.setItem('ambitie-answers-'+state.code+'-'+uid,JSON.stringify(answers))}

const rateNames=['Geen extra aandacht','Af en toe aandacht','Gerichte aandacht','Hoge ontwikkelbehoefte'];
const top2=()=>state.summary.filter(t=>t.mean!==null).slice(0,2);
const joinUrl=()=>location.origin+'/join?code='+encodeURIComponent(state.code);
function toast(msg){$('#toast').textContent=msg;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',3600)}
async function api(path,data,auth=false){const res=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',...(auth?{'X-Host-Key':hostKey}:{})},body:JSON.stringify(data)});let r=await res.json();if(!res.ok)throw Error(r.error||'Er ging iets mis');return r}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});let incoming=await r.json();let changed=incoming.revision!==lastRev;state=incoming;restore(state.code);$('#statusChip').textContent=`${({reflectie:'Individuele reflectie',bespreken:'Samen bespreken',groepen:'Groepsfase',afgerond:'Afgerond'})[state.phase]||'Actief'} · ${state.participants} deelnemers`;if(changed){lastRev=state.revision;render()}}catch(e){$('#statusChip').textContent='Verbinding onderbroken'}}
function heading(title,sub){return `<h2 class="intro">${esc(title)}</h2><p class="muted">${esc(sub)}</p>`}
// Scores tellen alleen EXTRA gewenste aandacht: keuze 1 = 0, keuze 4 = 3.
// We normaliseren eerst per beantwoorde stelling om vroege/ongelijke invulvoortgang
// niet als extra gewicht voor een thema te interpreteren.
function attentionShares(){
 const entries=state.summary;
 const weights=entries.map(t=>t.mean===null?0:Math.max(0,t.mean-1));
 const total=weights.reduce((a,b)=>a+b,0);
 return Object.fromEntries(entries.map((t,i)=>[t.id,total>0?100*weights[i]/total:0]));
}
function bubbleDiameter(share,hasAnswers){
 if(!hasAnswers)return 82;
 // De niet-lineaire schaal benadrukt de onderlinge verschillen.
 // Ook een bol van 0% blijft zichtbaar en aanklikbaar.
 return Math.round(76+224*Math.pow(share/100,0.68));
}
function bubbleHtml(t,i,shares){
 const share=shares[t.id], diameter=bubbleDiameter(share,t.mean!==null);
 const layout=[[26,39],[74,39],[50,76]][i];
 const from=bubbleSizes[t.id]??diameter;
 return `<div class="bubble ${t.mean===null?'hollow':''}" data-theme="${t.id}" data-size="${diameter}" style="width:${from}px;height:${from}px;left:${layout[0]}%;top:${layout[1]}%;background:${t.color}"><strong>${esc(t.short)}</strong><span>${t.mean!==null?`${share.toFixed(1)}% aandacht`:'Nog geen antwoorden'}</span></div>`;
}
function board(){
 const shares=attentionShares();
 const sorted=[...state.summary].sort((a,b)=>['team','pedagogiek','processen'].indexOf(a.id)-['team','pedagogiek','processen'].indexOf(b.id));
 return `<div class="bubble-board" aria-label="Relatieve aandacht per thema; de percentages tellen op tot honderd procent">${sorted.map((t,i)=>bubbleHtml(t,i,shares)).join('')}</div>`;
}
function animateBubbles(){
 const bubbles=[...document.querySelectorAll('.bubble[data-size]')];
 if(!bubbles.length)return;
 requestAnimationFrame(()=>bubbles.forEach(el=>{
  const target=Number(el.dataset.size);
  el.style.width=target+'px';el.style.height=target+'px';
  bubbleSizes[el.dataset.theme]=target;
 }));
}
function ranks(){
 const shares=attentionShares();
 return state.summary.map((t,i)=>{
  const pct=shares[t.id];
  return `<div class="theme-row ${i<2&&t.mean!==null?'top':''}" style="padding:12px;border-radius:12px"><div class="row"><strong>${i+1}. ${esc(t.name)}</strong><span class="score">${t.mean!==null?pct.toFixed(1)+'%':'–'}</span></div><div class="bar"><div style="width:${pct}%;background:${t.color}"></div></div><span class="tiny muted">${t.count} deelnemer(s) · gemiddelde aandacht ${t.mean??'–'}/4</span><button class="btn secondary tiny" style="margin-left:8px;padding:6px 9px" data-detail="${t.id}">Bekijk stellingen</button></div>`;
 }).join('');
}
function detailHtml(){let t=state.summary.find(x=>x.id===details);if(!t)return '';return `<section class="card"><div class="row"><h3>Inzoomen: ${esc(t.name)}</h3><button class="btn secondary" id="hideDetail">Sluiten</button></div>${t.questions.map((q,i)=>`<div class="detail"><strong>${i+1}. ${esc(q.text)}</strong><div class="muted tiny" style="margin-top:8px">Gemiddelde ontwikkelaandacht: ${q.mean??'–'} / 4 · ${q.count} antwoorden</div><div class="bar"><div style="width:${q.mean?100*(q.mean-1)/3:0}%;background:${t.color}"></div></div><div class="muted tiny">1: ${q.distribution[0]} · 2: ${q.distribution[1]} · 3: ${q.distribution[2]} · 4: ${q.distribution[3]}</div></div>`).join('')}</section>`}
function renderHost(){let root=$('#app');root.innerHTML=`<section class="card"><div class="row"><div>${heading('Waar geven we de komende acht weken aandacht aan?','De grootte laat het aandeel in de totale gewenste extra aandacht zien, geen oordeel over het belang van een thema.')}</div><span class="pill">Sessie ${state.code}</span></div><div class="dashboard"><div>${board()}</div><div><h3>Live aandacht per thema</h3>${ranks()}</div></div></section>${detailHtml()}<section class="card"><div class="row"><div><h3>Deelnemen via QR-code of link</h3><p class="muted tiny">De QR-code werkt zodra de website vanaf de telefoon bereikbaar is. Een localhost-adres werkt alleen op hetzelfde apparaat.</p><p><a href="${joinUrl()}" target="_blank" rel="noopener">${esc(joinUrl())}</a></p><button class="btn secondary" id="copyLink">Kopieer deelnemerslink</button></div><img class="qr" src="/api/qr?url=${encodeURIComponent(joinUrl())}" alt="QR-code voor de deelnemerslink"></div></section><section class="card"><div class="row"><div><h3>Hostbediening</h3><p class="muted">${state.participants} begonnen · ${state.completed} hebben alle 15 stellingen ingevuld</p></div><span class="code">${state.code}</span></div><div class="actions"><button class="btn ${state.phase==='reflectie'?'':'secondary'}" data-phase="reflectie">1. Reflectie open</button><button class="btn ${state.phase==='bespreken'?'':'secondary'}" data-phase="bespreken">2. Bollen bespreken</button><button class="btn ${state.phase==='groepen'?'':'secondary'}" data-phase="groepen">3. Groepsfase</button><button class="btn ${state.phase==='afgerond'?'':'secondary'}" data-phase="afgerond">4. Afronden</button></div><div class="actions" style="margin-top:16px"><button class="btn secondary" id="export">Resultaten exporteren</button><button class="btn warn" id="reset">Nieuwe sessie (wissen)</button></div></section>${(state.phase==='groepen'||state.phase==='afgerond')?`<section class="card"><h3>Acties voor de komende acht weken</h3>${groupsHtml()}</section>`:''}`;
 animateBubbles();
 document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{details=b.dataset.detail;renderHost()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{details=b.dataset.theme;renderHost()});$('#hideDetail')?.addEventListener('click',()=>{details='';renderHost()});$('#copyLink').onclick=()=>{navigator.clipboard.writeText(joinUrl()).then(()=>toast('Link gekopieerd')).catch(()=>toast('Kopiëren lukte niet'))};document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=async()=>{try{await api('host/phase',{phase:b.dataset.phase},true);await poll()}catch(e){toast(e.message)}});$('#reset').onclick=async()=>{if(!confirm('Alle antwoorden en groepsacties verwijderen en nieuwe sessie starten?'))return;try{await api('host/reset',{},true);details='';await poll();toast('Nieuwe sessie gestart')}catch(e){toast(e.message)}};$('#export').onclick=()=>{window.open('/api/export?key='+encodeURIComponent(hostKey),'_blank')};}
function groupsHtml(){return state.groups.length?state.groups.map(g=>`<div class="detail"><strong>${esc(g.group||'Groep')} · ${esc(state.themes.find(t=>t.id===g.theme)?.name||g.theme)}</strong><p><b>Morgen:</b> ${esc(g.tomorrow)}</p><p><b>8 weken:</b> ${esc(g.eightweeks)}</p><p><b>Zichtbaar aan:</b> ${esc(g.signal||'Nog niet ingevuld')}</p></div>`).join(''):'<div class="empty">Nog geen groepsacties ingediend.</div>'}
function renderParticipant(){let root=$('#app'),code=params.get('code');if(code!==state.code){root.innerHTML=`<section class="card">${heading('Welkom bij de Ambitiebol','Scan de QR-code van je gespreksleider om deel te nemen.')}<label class="label">Sessiecode</label><input class="field" id="codeInput" placeholder="Bijvoorbeeld A3B4C5" value="${esc(code||'')}"><button class="btn" id="enter">Deelnemen</button></section>`;$('#enter').onclick=()=>{location.href='/join?code='+encodeURIComponent($('#codeInput').value.trim().toUpperCase())};return}
 if(state.phase==='reflectie'){let t=state.themes[themeIndex];let count=Object.keys(answers).length;root.innerHTML=`<section class="card">${heading('Wat verdient extra aandacht?','Denk aan de komende acht weken. Een lage score betekent niet dat het onderwerp onbelangrijk is.')}
 <div class="row"><span class="pill">Thema ${themeIndex+1} van 3 · ${esc(t.name)}</span><span class="muted tiny">${count}/15 ingevuld</span></div><div class="progress"><div style="width:${100*count/15}%"></div></div>
 ${t.questions.map((q,i)=>{let k=t.id+'-'+i;return `<div class="question"><strong>${i+1}. ${esc(q)}</strong><div class="rating">${rateNames.map((txt,n)=>`<button aria-pressed="${answers[k]===n+1}" data-key="${k}" data-value="${n+1}" class="${answers[k]===n+1?'selected':''}">${n+1}<span>${txt}</span></button>`).join('')}</div></div>`}).join('')}
 <div class="actions" style="justify-content:space-between"><button class="btn secondary" id="prev" ${themeIndex===0?'disabled':''}>Vorige</button><button class="btn" id="next">${themeIndex===2?'Afronden':'Volgend thema'} →</button></div><p class="muted tiny">Je kunt je antwoorden tijdens de reflectie wijzigen. Ze worden automatisch opgeslagen.</p></section>`;
 document.querySelectorAll('[data-key]').forEach(b=>b.onclick=async()=>{answers[b.dataset.key]=Number(b.dataset.value);remember();renderParticipant();try{await api('answer',{uid,code:state.code,answers})}catch(e){toast('Opslaan mislukt: '+e.message)}});$('#prev').onclick=()=>{themeIndex=Math.max(0,themeIndex-1);renderParticipant()};$('#next').onclick=()=>{let done=t.questions.every((q,i)=>answers[t.id+'-'+i]);if(!done){toast('Beantwoord eerst de vijf stellingen van dit thema');return}if(themeIndex<2){themeIndex++;renderParticipant()}else if(count===15){root.innerHTML=`<section class="card" style="text-align:center"><h2 class="intro">Bedankt voor je reflectie!</h2><p>Je antwoorden zijn opgeslagen. Je gespreksleider laat de bollen zien.</p><button class="btn secondary" id="edit">Antwoorden aanpassen</button></section>`;$('#edit').onclick=()=>{themeIndex=0;renderParticipant()}}};return}
 if(state.phase==='bespreken'){root.innerHTML=`<section class="card" style="text-align:center">${heading('Samen kijken naar de bollen','Je antwoorden zijn binnen. Bespreek met elkaar waar de ontwikkelbehoefte vandaan komt.')}<div style="max-width:650px;margin:auto">${board()}</div></section>`;animateBubbles();document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>toast(state.summary.find(t=>t.id===b.dataset.theme).name));return}
 if(state.phase==='groepen'){let two=top2();root.innerHTML=`<section class="card">${heading('Van ambitie naar morgen','Een teamambitie is pas concreet genoeg als een collega kan vertellen wat hij of zij morgen anders gaat doen.')}<p class="muted">Kies een van de twee uitgelichte bollen en maak met je groep een uitvoerbaar plan voor acht weken.</p><form id="groupForm"><label class="label">Naam of nummer van jullie groep</label><input class="field" name="group" maxlength="120" placeholder="Bijvoorbeeld groep 2"><label class="label">Onze ambitiebol</label><select class="field" name="theme">${two.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><label class="label">Wat kunnen wij morgen anders doen? *</label><textarea class="field" name="tomorrow" required placeholder="Beschrijf gedrag dat een collega in de praktijk kan herkennen."></textarea><label class="label">Wat houden we de komende acht weken vol? *</label><textarea class="field" name="eightweeks" required placeholder="Welke concrete routine of afspraak helpt ons?"></textarea><label class="label">Waaraan merken we dat het werkt?</label><textarea class="field" name="signal" placeholder="Wat gaan we bij leerlingen of collega's zien?"></textarea><button class="btn" type="submit">Groepsactie indienen</button></form></section>`;$('#groupForm').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());data.code=state.code;try{await api('group',data);e.target.reset();toast('Groepsactie ingediend')}catch(err){toast(err.message)}};return}
 root.innerHTML=`<section class="card">${heading('Dank voor jullie bijdrage','Hieronder staan de ingediende plannen voor de komende acht weken.')}${groupsHtml()}</section>`}
function render(){if(!state)return;if(host){renderHost();return}
let active=document.activeElement, form=$('#groupForm'),draft=null;
if(state.phase==='groepen'&&form){draft=Object.fromEntries(new FormData(form).entries())}
renderParticipant();
if(draft&&$('#groupForm')){for(let [k,v] of Object.entries(draft)){let el=$('#groupForm').elements.namedItem(k);if(el)el.value=v}}
}
poll();setInterval(poll,1800);
</script></body></html>
