</style></head><body><header><div><h1>◉ De Ambitiebol</h1><small>Van gedeelde ambitie naar zichtbaar handelen · 2026–2027</small></div><span id="statusChip" class="chip">Verbinden...</span></header><main id="app" class="container"></main><div id="toast" role="status"></div><div id="presentationToolbar" class="hidden"><span>◉ De Ambitiebol · Live</span><button class="btn secondary" id="soundToggle">🔇 Geluid uit</button><button class="btn secondary" id="exitFullscreen">⛶ Sluiten</button></div><footer>Een kleine bol betekent niet dat een onderwerp onbelangrijk is. We onderzoeken waar de komende acht weken extra aandacht gewenst is.</footer><script>
const $=(q)=>document.querySelector(q), esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storage='ambitiebol-user', params=new URLSearchParams(location.search), host=location.pathname==='/host',hostKey=params.get('key')||sessionStorage.getItem('hostKey')||'';
if(hostKey&&host)sessionStorage.setItem('hostKey',hostKey);
const uid=(()=>{let v=localStorage.getItem(storage);if(!v){v=crypto.randomUUID();localStorage.setItem(storage,v)}return v})();
let state=null, answers={},questionIndex=0,lastRev=-1,details='',startThemeIndex=null,assigningStart=false,leaderId=null,soundEnabled=false,audioCtx=null;
let questionOrder=[],answerQueue=Promise.resolve(),surveyFinished=false;
let pendingPops=[]; // Themen waarvoor sinds de vorige poll een antwoord is gewijzigd.
let noteDraft={}, noteTimer=null, editingNotes=false;
const bubbleSizes={};
let persistedCode='';
let visualMode=localStorage.getItem('ambitiebol-visual-mode')||'overdrive';
if(!['rustig','dynamisch','overdrive'].includes(visualMode))visualMode='overdrive';
const motionDisabled=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const bubblePositions={};
function restore(code){
 if(persistedCode===code)return;
 persistedCode=code;startThemeIndex=null;questionIndex=0;leaderId=null;questionOrder=[];
 try{answers=JSON.parse(localStorage.getItem('ambitie-answers-'+code+'-'+uid)||'{}')}catch(e){answers={}}
 try{questionIndex=Number(localStorage.getItem('ambitie-question-index-'+code+'-'+uid)||0)||0}catch(e){questionIndex=0}
 surveyFinished=localStorage.getItem('ambitie-finished-'+code+'-'+uid)==='true';
}
function shuffledQuestions(){
 const all=state.themes.flatMap(t=>t.questions.map((question,i)=>({key:t.id+'-'+i,question})));
 const keys=all.map(q=>q.key).sort().join('|');
 const storageKey='ambitie-question-order-'+state.code+'-'+uid;
 let saved;
 try{saved=JSON.parse(localStorage.getItem(storageKey)||'null')}catch(e){saved=null}
 if(!Array.isArray(saved)||saved.length!==all.length||new Set(saved).size!==all.length||saved.some(k=>!all.some(q=>q.key===k))){
  // Stabiele pseudorandom Fisher-Yates shuffle per deelnemer én sessie.
  // Gebruik een deterministische PRNG zodat een herladen pagina dezelfde volgorde houdt.
  let seed=(Math.floor(hashUnit(uid+'|'+state.code+'|'+keys)*4294967295)||1)>>>0;
  const next=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296};
  saved=all.map(q=>q.key);
  for(let i=saved.length-1;i>0;i--){const j=Math.floor(next()*(i+1));[saved[i],saved[j]]=[saved[j],saved[i]]}
  localStorage.setItem(storageKey,JSON.stringify(saved));
 }
 const byKey=new Map(all.map(q=>[q.key,q]));
 return saved.map(k=>byKey.get(k));
}
function rememberQuestionIndex(){if(state)localStorage.setItem('ambitie-question-index-'+state.code+'-'+uid,String(questionIndex))}

function remember(){if(state)localStorage.setItem('ambitie-answers-'+state.code+'-'+uid,JSON.stringify(answers))}

const rateNames=['Geen extra aandacht','Af en toe aandacht','Gerichte aandacht','Hoge ontwikkelbehoefte'];
const top2=()=>{const ids=state.focus?.length?state.focus:state.summary.filter(t=>t.mean!==null).slice(0,2).map(t=>t.id);return ids.map(id=>state.summary.find(t=>t.id===id)).filter(Boolean)};
const joinUrl=()=>location.origin+'/join?code='+encodeURIComponent(state.code);
function toast(msg){$('#toast').textContent=msg;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',3600)}
async function api(path,data,auth=false){const res=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',...(auth?{'X-Host-Key':hostKey}:{})},body:JSON.stringify(data)});let r=await res.json();if(!res.ok)throw Error(r.error||'Er ging iets mis');return r}
// Vergelijk ook verdelingen per vraag: een gewijzigd cijfer kan hetzelfde themagemiddelde behouden.
function changedThemes(previous,current){
 const before=new Map((previous.summary||[]).map(t=>[t.id,t]));
 return (current.summary||[]).filter(t=>{
  const old=before.get(t.id);
  if(!old)return false;
  return (t.questions||[]).some((q,i)=>JSON.stringify(q.distribution)!==JSON.stringify(old.questions?.[i]?.distribution));
 }).map(t=>t.id);
}
function labelWave(text){return esc(text)} // Hele woord beweegt als één unit.
function hashUnit(seed){
 let h=2166136261>>>0;
 const text=String(seed);
 for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}
 return (h>>>0)/4294967295;
}
function mix(a,b,t){return a+(b-a)*t}
function typographyForDiameter(d,short){
 const compact=short.length>17?.74:short.length>12?.83:1;
 return {label:Math.max(10,Math.min(55,d*.115*compact)),caption:Math.max(9,Math.min(22,d*.052))};
}
function applyBubbleTypography(el,diameter){
 const label=el.dataset.label||'';
 const values=typographyForDiameter(diameter,label);
 el.style.setProperty('--label-size',values.label.toFixed(1)+'px');
 el.style.setProperty('--caption-size',values.caption.toFixed(1)+'px');
}
// Web Animations transform overlays the normal positioning without changing final dimensions.
function animateAnswerPops(){
 const themes=[...new Set(pendingPops)];pendingPops=[];
 if(!host||state?.phase!=='reflectie'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const boardEl=document.querySelector('.bubble-board');if(!boardEl)return;
 const durations={rustig:460,dynamisch:580,overdrive:680};
 const basePeak={rustig:1.13,dynamisch:1.20,overdrive:1.28}[visualMode];
 for(const id of themes){
  const el=[...boardEl.querySelectorAll('.bubble')].find(b=>b.dataset.theme===id);
  if(!el)continue;
  // Gecontroleerde pseudo-random variatie: niet mechanisch synchroon, wel coherent.
  const r1=hashUnit(`${id}:${state.revision}:a`);
  const r2=hashUnit(`${id}:${state.revision}:b`);
  const r3=hashUnit(`${id}:${state.revision}:c`);
  const delay=Math.round(mix(0,85,r1));
  const duration=durations[visualMode]+Math.round(mix(-35,45,r2));
  const peak=basePeak+mix(-.035,.06,r3);
  const dip=mix(.948,.985,r2);
  const riseOffset=mix(.18,.28,r1);
  const dipOffset=mix(.66,.79,r3);
  el.animate([
   {transform:'translate(-50%, -50%) scale(1)',offset:0},
   {transform:`translate(-50%, -50%) scale(${peak.toFixed(3)})`,offset:riseOffset},
   {transform:`translate(-50%, -50%) scale(${dip.toFixed(3)})`,offset:dipOffset},
   {transform:'translate(-50%, -50%) scale(1)',offset:1}
  ],{duration,easing:'ease-out',delay});
  // Hele woord maakt dezelfde snelle links-rechts-links beweging, met minieme variatie.
  const title=el.querySelector('.bubble-title');
  if(title){
   title.getAnimations().forEach(a=>a.cancel());
   const major= mix(38,52,r1);
   const returnTilt = mix(18,32,r2);
   const startLeft = r3>.5 ? -1 : 1;
   const first= startLeft*major;
   const second= -startLeft*mix(major*.88,major*1.03,r2);
   const third= startLeft*returnTilt;
   const k1=mix(.18,.24,r2),k2=mix(.46,.56,r3),k3=mix(.72,.82,r1);
   title.animate([
    {transform:'rotate(0deg)',offset:0},
    {transform:`rotate(${first.toFixed(1)}deg)`,offset:k1},
    {transform:`rotate(${second.toFixed(1)}deg)`,offset:k2},
    {transform:`rotate(${third.toFixed(1)}deg)`,offset:k3},
    {transform:'rotate(0deg)',offset:1}
   ],{duration,easing:'ease-in-out',delay});
  }
 }
}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});let incoming=await r.json();let changed=incoming.revision!==lastRev;const oldState=state;pendingPops=(host&&oldState&&oldState.code===incoming.code&&oldState.phase==='reflectie'&&incoming.phase==='reflectie')?changedThemes(oldState,incoming):[];state=incoming;restore(state.code);$('#statusChip').textContent=`${({reflectie:'Individuele reflectie',bespreken:'Samen bespreken',afgerond:'Afgerond'})[state.phase]||'Actief'} · ${state.participants} deelnemers`;if(changed){lastRev=state.revision;if(!(host&&state.phase==='afgerond'&&(editingNotes||document.activeElement?.matches('.note-field'))))render();if(host)checkLeader()}if(!host&&state.phase==='reflectie'&&params.get('code')===state.code&&startThemeIndex===null&&!assigningStart)assignStart()}catch(e){$('#statusChip').textContent='Verbinding onderbroken'}}

async function assignStart(){
 assigningStart=true;
 try{let a=await api('start',{uid,code:state.code});startThemeIndex=a.start;questionOrder=shuffledQuestions();questionIndex=Math.max(0,Math.min(questionIndex,questionOrder.length-1));render()}
 catch(e){toast('Startthema ophalen mislukt: '+e.message)}finally{assigningStart=false}
}
// Deelnemers zien geen themagroepen; de themakoppeling blijft alleen in de verborgen antwoordsleutels.
function latestLeader(){
 if(!state||!state.summary)return null;
 const shares=attentionShares();const arr=[...state.summary].sort((a,b)=>shares[b.id]-shares[a.id]);
 return arr.length&&shares[arr[0].id]>0&&shares[arr[0].id]>shares[arr[1].id]+.0001?arr[0].id:null;
}
function checkLeader(){
 const next=latestLeader();if(next!==leaderId){leaderId=next;
  if(next){playPlop()}
 }
}
function playPlop(){
 if(!soundEnabled||!audioCtx)return;
 try{if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;
 const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='sine';
 osc.frequency.setValueAtTime(550,now);osc.frequency.exponentialRampToValueAtTime(205,now+.16);
 g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.095,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+.18);
 osc.connect(g);g.connect(audioCtx.destination);osc.start(now);osc.stop(now+.19);
 }catch(e){}
}
async function enableSound(){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){toast('Audio niet ondersteund');return}audioCtx=audioCtx||new Audio();await audioCtx.resume();soundEnabled=true;updatePresentationToolbar()}catch(e){toast('Geluid niet beschikbaar')}}
function updatePresentationToolbar(){const btn=$('#soundToggle');if(btn)btn.textContent=soundEnabled?'🔊 Geluid aan':'🔇 Geluid uit'}
async function togglePresentation(){
 if(document.fullscreenElement){await document.exitFullscreen();return}
 try{const opening=document.documentElement.requestFullscreen();enableSound();await opening;}catch(e){toast('Fullscreen is niet toegestaan in deze browser');}
}
function syncPresentation(){const on=!!document.fullscreenElement&&host;document.body.classList.toggle('presentation-mode',on);$('#presentationToolbar').classList.toggle('hidden',!on);if(on)updatePresentationToolbar();requestAnimationFrame(()=>animateBubbles())}
document.addEventListener('fullscreenchange',syncPresentation);

function heading(title,sub){return `<h2 class="intro">${esc(title)}</h2><p class="muted">${esc(sub)}</p>`}
// Scores tellen alleen EXTRA gewenste aandacht: keuze 1 = 0, keuze 4 = 3.
// We normaliseren eerst per beantwoorde stelling om vroege/ongelijke invulvoortgang
// niet als extra gewicht voor een thema te interpreteren.
function attentionShares(){
 const entries=state.summary;
 const weights=entries.map(t=>t.mean===null?0:Math.max(0,t.mean-1));
 const total=weights.reduce((a,b)=>a+b,0);
 return Object.fromEntries(entries.map((t,i)=>[t.id,total>0?100*weights[i]/total:0]));
}
// Presentation only: percentages stay unchanged; area proportions get dramatically amplified.
// The power applies to the fraction of desired extra attention, not the rating scale.
function visualWeights(shares){
 const power={rustig:1.15,dynamisch:2.2,overdrive:4}[visualMode];
 const raw=state.summary.map(t=>Math.pow(shares[t.id]||0,power));
 const total=raw.reduce((a,b)=>a+b,0);
 return Object.fromEntries(state.summary.map((t,i)=>[t.id,total>0?raw[i]/total:1/state.summary.length]));
}
const bubbleSeeds=[[.22,.28],[.50,.24],[.77,.26],[.30,.55],[.72,.56],[.23,.81],[.79,.82]];
function board(onlyFocus=false){
 const shares=attentionShares();
 const sorted=[...(onlyFocus?top2():state.summary)].sort((a,b)=>['autonomie','pedagogiek','didactiek','verbinding','scholing','expertise','organisatie'].indexOf(a.id)-['autonomie','pedagogiek','didactiek','verbinding','scholing','expertise','organisatie'].indexOf(b.id));
 return `<div class="bubble-board ${onlyFocus?'focus-board':''}" data-mode="${visualMode}" aria-label="Relatieve aandacht per thema">${sorted.map((t,i)=>onlyFocus?focusBubbleHtml(t,i,shares):bubbleHtml(t,i,shares)).join('')}</div>`;
}
function bubbleHtml(t,i,shares){
 const share=shares[t.id],hasAnswers=t.mean!==null;
 const loc=bubblePositions[t.id]||bubbleSeeds[i];
 return `<div class="bubble ${!hasAnswers?'hollow':''}" data-theme="${t.id}" data-label="${esc(t.short)}" data-share="${share}" style="width:${bubbleSizes[t.id]||75}px;height:${bubbleSizes[t.id]||75}px;left:${100*loc[0]}%;top:${100*loc[1]}%;background:${t.color}"><strong class="bubble-title">${labelWave(t.short)}</strong><span class="bubble-caption">${hasAnswers?`${share.toFixed(1)}% aandacht`:'Nog geen antwoorden'}</span></div>`;
}
function focusBubbleHtml(t,i,shares){
 const share=shares[t.id],diameter=300;
 return `<div class="bubble focus-bubble" data-theme="${t.id}" data-label="${esc(t.name)}" data-size="${diameter}" style="width:${diameter}px;height:${diameter}px;left:${i===0?27:73}%;top:50%;background:${t.color}"><strong class="bubble-title">${esc(t.name)}</strong><span class="bubble-caption">${share.toFixed(1)}% van de extra aandacht</span></div>`;
}
function animateBubbles(){
 const boardEl=document.querySelector('.bubble-board');
 if(!boardEl)return;
 const bubbles=[...boardEl.querySelectorAll('.bubble')];
 if(!bubbles.length)return;
 if(bubbles.every(b=>b.classList.contains('focus-bubble'))){
  requestAnimationFrame(()=>bubbles.forEach(el=>{const d=Math.round(Math.min(boardEl.clientWidth*.43,boardEl.clientHeight*.72,390));el.style.width=d+'px';el.style.height=d+'px';applyBubbleTypography(el,d)}));return;
 }
 const shares=attentionShares(),weights=visualWeights(shares);
 const bw=boardEl.clientWidth,bh=boardEl.clientHeight;
 if(!bw||!bh)return;
 const maxSize=Math.min(bw*.55,bh*.72,500);
 const minSize=Math.max(42,Math.min(76,bw*.08));
 const scale=visualMode==='overdrive'?1.58:visualMode==='dynamisch'?1.27:1.13;
 const candidates=bubbles.map((el,i)=>{
  let diameter=Math.max(minSize,Math.min(maxSize,minSize+scale*Math.sqrt(weights[el.dataset.theme])*Math.min(bw,bh)));
  const id=el.dataset.theme;
  const last=bubblePositions[id]||bubbleSeeds[i];
  return {el,id,diameter,x:last[0]*bw,y:last[1]*bh};
 });
 // Limit global occupied area so collisions can resolve within the board.
 const area=candidates.reduce((sum,c)=>sum+Math.PI*(c.diameter/2+5)**2,0);
 const capacity=bw*bh*.56;
 if(area>capacity){const shrink=Math.sqrt(capacity/area);candidates.forEach(c=>c.diameter=Math.max(minSize*.68,c.diameter*shrink))}
 const byWeight=[...candidates].sort((a,b)=>weights[b.id]-weights[a.id]);
 const leader=byWeight[0]?.id;
 const runner=byWeight[1]?.id;
 // Leaders gravitate toward the center; less important bubbles get pushed to the edges.
 const centerStrength={rustig:.08,dynamisch:.24,overdrive:.43}[visualMode];
 for(let k=0;k<65;k++){
  for(const c of candidates){
   const seed=bubbleSeeds[state.summary.findIndex(t=>t.id===c.id)]||[.5,.5];
   const targetX=c.id===leader?bw*.5:seed[0]*bw;
   const targetY=c.id===leader?bh*.48:seed[1]*bh;
   const pull=c.id===leader?centerStrength*.09:.012;
   c.x+=(targetX-c.x)*pull;c.y+=(targetY-c.y)*pull;
  }
  for(let i=0;i<candidates.length;i++)for(let j=i+1;j<candidates.length;j++){
   const a=candidates[i],b=candidates[j],dx=b.x-a.x,dy=b.y-a.y;
   let dist=Math.hypot(dx,dy);const desired=(a.diameter+b.diameter)/2+9;
   if(dist<desired){
    if(dist<.01)dist=.01;
    const ux=dx/dist||1,uy=dy/dist||0,push=(desired-dist)*.53;
    // More mass = harder to push.
    const ma=a.diameter*a.diameter,mb=b.diameter*b.diameter;
    a.x-=ux*push*mb/(ma+mb)*2;a.y-=uy*push*mb/(ma+mb)*2;
    b.x+=ux*push*ma/(ma+mb)*2;b.y+=uy*push*ma/(ma+mb)*2;
   }
  }
  for(const c of candidates){const r=c.diameter/2+3;c.x=Math.max(r,Math.min(bw-r,c.x));c.y=Math.max(r,Math.min(bh-r,c.y))}
 }
 requestAnimationFrame(()=>candidates.forEach(c=>{
  const el=c.el;
  el.style.width=c.diameter+'px';el.style.height=c.diameter+'px';applyBubbleTypography(el,c.diameter);
  el.style.left=(100*c.x/bw)+'%';el.style.top=(100*c.y/bh)+'%';
  el.classList.toggle('leader',c.id===leader&&shares[c.id]>0);
  el.classList.toggle('runner',c.id===runner&&shares[c.id]>0);
  el.classList.toggle('distant',c.id!==runner&&c.id!==leader);
  bubblePositions[c.id]=[c.x/bw,c.y/bh];
  bubbleSizes[c.id]=c.diameter;
 }));
}
function modePicker(){return `<div class="mode-picker" role="group" aria-label="Animatiestijl"><strong>Weergave:</strong>${[['rustig','Rustig'],['dynamisch','Dynamisch'],['overdrive','⚡ OVERDRIVE']].map(([id,label])=>`<button type="button" data-mode="${id}" class="${visualMode===id?'active':''}" aria-pressed="${visualMode===id}">${label}</button>`).join('')}</div><p class="muted tiny">Overdrive versterkt alleen het visuele verschil. Percentages en top twee blijven exact gelijk.</p>`}
function ranks(){
 const shares=attentionShares();
 return state.summary.map((t,i)=>{
  const pct=shares[t.id];
  return `<div class="theme-row ${i<2&&t.mean!==null?'top':''}" style="padding:12px;border-radius:12px"><div class="row"><strong>${i+1}. ${esc(t.name)}</strong><span class="score">${t.mean!==null?pct.toFixed(1)+'%':'–'}</span></div><div class="bar"><div style="width:${pct}%;background:${t.color}"></div></div><span class="tiny muted">${t.count} deelnemer(s) · gemiddelde aandacht ${t.mean??'–'}/4</span><button class="btn secondary tiny" style="margin-left:8px;padding:6px 9px" data-detail="${t.id}">Bekijk stellingen</button></div>`;
 }).join('');
}
function detailHtml(){let t=state.summary.find(x=>x.id===details);if(!t)return '';return `<section class="card"><div class="row"><h3>Inzoomen: ${esc(t.name)}</h3><button class="btn secondary" id="hideDetail">Sluiten</button></div>${t.questions.map((q,i)=>`<div class="detail"><strong>${i+1}. ${esc(q.text)}</strong><div class="muted tiny" style="margin-top:8px">Gemiddelde ontwikkelaandacht: ${q.mean??'–'} / 4 · ${q.count} antwoorden</div><div class="bar"><div style="width:${q.mean?100*(q.mean-1)/3:0}%;background:${t.color}"></div></div><div class="muted tiny">1: ${q.distribution[0]} · 2: ${q.distribution[1]} · 3: ${q.distribution[2]} · 4: ${q.distribution[3]}</div></div>`).join('')}</section>`}
function focusInstructions(){return `<section class="card assignment"><h2>Groepsopdracht · 10–15 minuten</h2><p class="muted">De twee bollen met de meeste extra ontwikkelaandacht vormen ons vertrekpunt.</p><ol><li>Vorm een <b>groepje van vier</b>.</li><li>Neem <b>één bol</b> mee die jullie aanspreekt.</li><li>Verzin samen <b>drie ambities</b> bij die bol die voor jullie belangrijk zijn.</li><li>Maak ze <b>uitvoerbaar in de komende acht weken</b>.</li></ol><blockquote>Een teamambitie is pas concreet genoeg als een collega kan vertellen wat hij of zij morgen anders gaat doen.</blockquote><p><b>Bespreekvraag:</b> Wat kunnen jullie morgen anders doen?</p></section>`}
function ambitionEditor(theme){let values=noteDraft[theme.id]||state.ambitions?.[theme.id]||['','',''];return `<article class="focus-editor" style="--bubble-color:${theme.color}"><div class="editor-circle" style="background:${theme.color}">${esc(theme.name)}</div><div class="editor-fields"><p class="muted">Noteer de uitvoerbare ambities die groepjes noemen. Gebruik één regel per ambitie.</p>${values.map((v,i)=>`<label class="label" for="note-${theme.id}-${i}">Ambitie ${i+1}</label><textarea class="field note-field" id="note-${theme.id}-${i}" data-theme-note="${theme.id}" data-note-index="${i}" rows="2" placeholder="Wat gaan we morgen concreet anders doen?">${esc(v)}</textarea>`).join('')}<button class="btn secondary" data-add-note="${theme.id}">+ Nog een ambitie</button><span class="tiny muted" id="note-status-${theme.id}">Wijzigingen worden automatisch opgeslagen</span></div></article>`}
function setupNotes(){
 for(const t of top2()){if(!noteDraft[t.id])noteDraft[t.id]=[...(state.ambitions?.[t.id]||['','',''])]}
 document.querySelectorAll('[data-theme-note]').forEach(el=>el.addEventListener('input',()=>{
  const id=el.dataset.themeNote;noteDraft[id][Number(el.dataset.noteIndex)]=el.value;editingNotes=true;
  clearTimeout(noteTimer);const status=$('#note-status-'+id);if(status)status.textContent='Opslaan…';
  noteTimer=setTimeout(()=>saveNotes(id),650);
 }));
 document.querySelectorAll('[data-add-note]').forEach(el=>el.onclick=async()=>{
  const id=el.dataset.addNote;clearTimeout(noteTimer);await saveNotes(id);noteDraft[id].push('');renderHost();
 });
}
async function saveNotes(id){if(!noteDraft[id])return;try{await api('host/ambitions',{theme:id,items:noteDraft[id]},true);const status=$('#note-status-'+id);if(status)status.textContent='✓ Opgeslagen';}catch(e){toast('Opslaan mislukt: '+e.message)}finally{editingNotes=false}}
function renderHost(){
 const root=$('#app'),focused=state.phase==='bespreken'||state.phase==='afgerond';
 let content='';
 if(state.phase==='reflectie'){
  content=`<section class="card"><div class="row"><div>${heading('Waar geven we de komende acht weken aandacht aan?','De grootte toont het aandeel in de totale gewenste extra aandacht.')}</div><span class="pill">Sessie ${state.code}</span></div><div class="actions presentation-launch"><button class="btn secondary" id="goFullscreen">⛶ Bollen fullscreen</button></div>${modePicker()}<div class="dashboard"><div>${board()}</div><div><h3>Live aandacht per thema</h3>${ranks()}</div></div></section>${detailHtml()}`;
 }else if(state.phase==='bespreken'){
  content=`<section class="card"><div class="row"><div>${heading('Deze twee bollen nemen we mee','De gekozen focus is vastgezet op basis van de antwoorden bij het sluiten van de reflectie.')}</div><span class="pill">Sessie ${state.code}</span></div><div class="actions presentation-launch"><button class="btn secondary" id="goFullscreen">⛶ Bollen fullscreen</button></div>${top2().length?`<div class="dashboard focus-dashboard"><div>${board(true)}</div><div><h3>Twee aandachtsgebieden</h3>${top2().map((t,i)=>`<div class="theme-row"><strong>${i+1}. ${esc(t.name)}</strong><p class="muted">${attentionShares()[t.id].toFixed(1)}% van de extra ontwikkelaandacht</p></div>`).join('')}</div></div>`:'<div class="empty">Nog geen antwoorden ontvangen. Ga terug naar reflectie om antwoorden te verzamelen.</div>'}</section>${focusInstructions()}`;
 }else{
  content=`<section class="card"><div class="row"><div>${heading('Afronden · van bol naar ambitie','De groepjes delen hun ideeën. Noteer hieronder wat zij morgen concreet anders willen doen.')}</div><span class="pill">Sessie ${state.code}</span></div><div class="actions presentation-launch"><button class="btn secondary" id="goFullscreen">⛶ Bollen fullscreen</button></div></section><section class="card"><h3>Onze twee aandachtsgebieden</h3><div class="editor-grid">${top2().map(ambitionEditor).join('')||'<div class="empty">Nog geen twee thema’s beschikbaar.</div>'}</div></section>`;
 }
 const controls=`<section class="card host-controls"><div class="row"><div><h3>Hostbediening</h3><p class="muted">${state.participants} begonnen · ${state.completed} hebben alle 35 stellingen ingevuld</p></div><span class="code">${state.code}</span></div><div class="actions"><button class="btn ${state.phase==='reflectie'?'':'secondary'}" data-phase="reflectie">1. Reflectie open</button><button class="btn ${state.phase==='bespreken'?'':'secondary'}" data-phase="bespreken">2. Bollen bespreken</button><button class="btn ${state.phase==='afgerond'?'':'secondary'}" data-phase="afgerond">3. Afronden</button></div><div class="actions" style="margin-top:16px"><button class="btn secondary" id="exportNotes">Exporteer ambities (CSV)</button><button class="btn secondary" id="exportRaw">Exporteer ruwe antwoorden (CSV)</button><button class="btn secondary" id="exportJson">Volledige export (JSON)</button><button class="btn warn" id="reset">Nieuwe sessie (wissen)</button></div></section>`;
 const joining=`<section class="card"><div class="row"><div><h3>Deelnemen via QR-code of link</h3><p><a href="${joinUrl()}" target="_blank" rel="noopener">${esc(joinUrl())}</a></p><button class="btn secondary" id="copyLink">Kopieer deelnemerslink</button></div><img class="qr" src="/api/qr?url=${encodeURIComponent(joinUrl())}" alt="QR-code voor de deelnemerslink"></div></section>`;
 root.innerHTML=content+(!focused?joining:'')+controls;
 animateBubbles();
 // Plan de pop nadat de nieuwe DOM-elementen en hun doelmaten zijn gezet.
 requestAnimationFrame(()=>requestAnimationFrame(animateAnswerPops));
 document.querySelectorAll('button[data-mode]').forEach(btn=>btn.onclick=()=>{visualMode=btn.dataset.mode;localStorage.setItem('ambitiebol-visual-mode',visualMode);renderHost()});
 document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{details=b.dataset.detail;renderHost()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{details=b.dataset.theme;renderHost()});$('#hideDetail')?.addEventListener('click',()=>{details='';renderHost()});
 $('#goFullscreen')?.addEventListener('click',togglePresentation);$('#copyLink')?.addEventListener('click',()=>{navigator.clipboard.writeText(joinUrl()).then(()=>toast('Link gekopieerd')).catch(()=>toast('Kopiëren lukte niet'))});
 document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=async()=>{try{if(editingNotes){clearTimeout(noteTimer);for(const id of Object.keys(noteDraft))await saveNotes(id)}await api('host/phase',{phase:b.dataset.phase},true);lastRev=-1;await poll()}catch(e){toast(e.message)}});
 $('#reset').onclick=async()=>{if(!confirm('Alle antwoorden en genoteerde ambities wissen en een nieuwe sessie starten?'))return;try{await api('host/reset',{},true);details='';noteDraft={};lastRev=-1;await poll();toast('Nieuwe sessie gestart')}catch(e){toast(e.message)}};
 for(const [id,path] of [['exportNotes','ambities.csv'],['exportRaw','raw.csv'],['exportJson','']]){$('#'+id).onclick=async()=>{if(editingNotes){clearTimeout(noteTimer);for(const theme of Object.keys(noteDraft))await saveNotes(theme)}window.open((path?'/api/export/'+path:'/api/export')+'?key='+encodeURIComponent(hostKey),'_blank')}}
 if(state.phase==='afgerond')setupNotes();
}
function renderParticipant(){
 const root=$('#app'),code=params.get('code');
 if(code!==state.code){
  root.innerHTML=`<section class="card">${heading('Welkom bij de Ambitiebol','Scan de QR-code van je gespreksleider om deel te nemen.')}<label class="label">Sessiecode</label><input class="field" id="codeInput" placeholder="Bijvoorbeeld A3B4C5" value="${esc(code||'')}"><button class="btn" id="enter">Deelnemen</button></section>`;
  $('#enter').onclick=()=>{location.href='/join?code='+encodeURIComponent($('#codeInput').value.trim().toUpperCase())};return;
 }
 if(state.phase==='reflectie'){
  if(startThemeIndex===null){root.innerHTML='<section class="card"><h2>Je vragenlijst wordt klaargezet…</h2></section>';return}
  if(!questionOrder.length)questionOrder=shuffledQuestions();
  const total=questionOrder.length;
  const count=questionOrder.filter(q=>answers[q.key]>=1&&answers[q.key]<=4).length;
  if(questionIndex>=total)questionIndex=total-1;
  const current=questionOrder[questionIndex];
  if(surveyFinished&&count===total){
   root.innerHTML=`<section class="card" style="text-align:center"><h2 class="intro">Bedankt voor je reflectie!</h2><p>Je antwoorden zijn opgeslagen. Je gespreksleider laat de bollen zien.</p><button class="btn secondary" id="edit">Antwoorden aanpassen</button></section>`;
   $('#edit').onclick=()=>{surveyFinished=false;localStorage.removeItem('ambitie-finished-'+state.code+'-'+uid);questionIndex=0;rememberQuestionIndex();renderParticipant()};return;
  }
  root.innerHTML=`<section class="card">${heading('Wat verdient extra aandacht?','Denk aan de komende acht weken. Een lage score betekent niet dat het onderwerp onbelangrijk is.')}
   <div class="row"><span class="pill">Stelling ${questionIndex+1} van ${total}</span><span class="muted tiny">${count}/${total} ingevuld</span></div>
   <div class="progress"><div style="width:${100*count/total}%"></div></div>
   <div class="question"><strong>${esc(current.question)}</strong><div class="rating">${rateNames.map((txt,n)=>`<button aria-pressed="${answers[current.key]===n+1}" data-key="${current.key}" data-value="${n+1}" class="${answers[current.key]===n+1?'selected':''}">${n+1}<span>${txt}</span></button>`).join('')}</div></div>
   <div class="actions" style="justify-content:space-between"><button class="btn secondary" id="prev" ${questionIndex===0?'disabled':''}>← Vorige</button><button class="btn" id="next">${questionIndex===total-1?'Afronden':'Volgende →'}</button></div>
   <p class="muted tiny">Alle stellingen staan in willekeurige volgorde. Je kunt eerdere antwoorden aanpassen; ze worden automatisch opgeslagen.</p></section>`;
  document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{
   const key=b.dataset.key,previous=answers[key];
   answers[key]=Number(b.dataset.value);remember();renderParticipant();
   const snapshot={...answers};
   // De volledige antwoordset moet in volgorde worden opgeslagen, anders kan een
   // vertraagd netwerkantwoord nieuwere scores overschrijven.
   answerQueue=answerQueue.catch(()=>{}).then(async()=>{
    try{await api('answer',{uid,code:state.code,answers:snapshot})}
    catch(e){toast('Opslaan mislukt: '+e.message)}
   });
  });
  $('#prev').onclick=()=>{questionIndex=Math.max(0,questionIndex-1);rememberQuestionIndex();renderParticipant()};
  $('#next').onclick=()=>{
   if(!answers[current.key]){toast('Beantwoord eerst deze stelling');return}
   if(questionIndex<total-1){questionIndex++;rememberQuestionIndex();renderParticipant();return}
   if(count!==total){const firstMissing=questionOrder.findIndex(q=>!answers[q.key]);questionIndex=Math.max(0,firstMissing);rememberQuestionIndex();toast('Beantwoord eerst alle stellingen');renderParticipant();return}
   surveyFinished=true;localStorage.setItem('ambitie-finished-'+state.code+'-'+uid,'true');renderParticipant();
  };
  return;
 }
 if(state.phase==='bespreken'){
  root.innerHTML=`<section class="card" style="text-align:center">${heading('Bollen bespreken','Vorm groepjes van vier. Kies één van de twee uitgelichte thema’s en formuleer drie haalbare ambities voor de komende acht weken.')}${focusInstructions()}<div style="max-width:650px;margin:auto">${board(true)}</div></section>`;animateBubbles();return;
 }
 root.innerHTML=`<section class="card">${heading('Dank voor jullie bijdrage','De gespreksleider verzamelt nu de concrete ambities die de groepjes delen.')}</section>`;
}

function render(){if(!state)return;if(host){renderHost();return}
renderParticipant();
}
$('#exitFullscreen').onclick=()=>document.exitFullscreen();$('#soundToggle').onclick=async()=>{if(soundEnabled){soundEnabled=false;updatePresentationToolbar()}else await enableSound()};poll();setInterval(poll,1800);
</script></body></html>
